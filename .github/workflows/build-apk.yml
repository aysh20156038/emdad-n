name: Build Emdad Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-Extract ZIP if uploaded
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name '*.zip' | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE ..."
            unzip -o "$ZIP_FILE"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android APK
        run: |
          SETTINGS_FILE=$(find . -maxdepth 4 -name 'settings.gradle' | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found!"
            find . -maxdepth 3
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Building project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if ! grep -q "kotlin-bom" app/build.gradle; then
            python3 -c 'p="app/build.gradle"; s=open(p).read(); open(p,"w").write(s.replace("dependencies {", "dependencies {\n    implementation platform(\"org.jetbrains.kotlin:kotlin-bom:1.8.22\")", 1))'
          fi

          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Emdad-v1.0.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Emdad-Android-APK
          path: Emdad-v1.0.apk
